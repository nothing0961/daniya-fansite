# Netlify 配置 — Next.js + Prisma (Neon Serverless)

[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# 安全响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# 静态资源缓存
[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.ogg"
  [headers.values]
    Cache-Control = "public, max-age=3600"
